name: parwarish_ai
description: "Parwarish.ai - An adaptive learning and gamified daily routine app for autistic children and their parents."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Strictly pinned & specified dependencies
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.1
  cloud_firestore: ^6.9.0
  shared_preferences: ^2.5.5
  flutter_tts: ^4.2.5
  speech_to_text: ^7.4.0
  video_player: ^2.14.0
  lottie: ^3.5.1
  camera: ^0.12.0+2
  flutter_animate: ^4.5.2
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^8.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/animations/
    - assets/icons/
    - assets/images/
